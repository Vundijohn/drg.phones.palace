<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 68" width="340" height="68" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141424"/>
      <stop offset="50%" stop-color="#0c0c16"/>
      <stop offset="100%" stop-color="#08080f"/>
    </linearGradient>

    <!-- Metallic Gold Stroke Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8d5a3"/>
      <stop offset="35%" stop-color="#c8a96e"/>
      <stop offset="70%" stop-color="#fdf4dd"/>
      <stop offset="100%" stop-color="#9a7b3e"/>
    </linearGradient>

    <!-- Metallic Text Gradient for DRG -->
    <linearGradient id="drgTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f5e8cf"/>
      <stop offset="85%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#c8a96e"/>
    </linearGradient>

    <!-- Champagne Gold Gradient for Phones Palace -->
    <linearGradient id="palaceTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dfc792"/>
      <stop offset="50%" stop-color="#f4e5c2"/>
      <stop offset="100%" stop-color="#c8a96e"/>
    </linearGradient>

    <!-- Crown / Icon Gradient -->
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a8ff"/>
      <stop offset="50%" stop-color="#0066cc"/>
      <stop offset="100%" stop-color="#c8a96e"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Capsule Outer Glow & Background -->
  <rect x="2" y="2" width="336" height="64" rx="32" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="336" height="64" rx="32" stroke="url(#goldBorder)" stroke-width="1.5" stroke-opacity="0.85"/>
  <rect x="5" y="5" width="330" height="58" rx="29" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Left Icon Emblem: Luxury Circular Medallion -->
  <g transform="translate(10, 10)">
    <circle cx="24" cy="24" r="24" fill="#ffffff" filter="url(#softGlow)"/>
    <circle cx="24" cy="24" r="23" stroke="url(#goldBorder)" stroke-width="1.5"/>
    
    <!-- Stylized Modern 2D Smartphone + Crown Silhouette in Medallion -->
    <rect x="17" y="10" width="14" height="26" rx="3" fill="#0d1b2a"/>
    <rect x="18.5" y="12" width="11" height="20" rx="1.5" fill="#1d3557"/>
    <circle cx="24" cy="34" r="1" fill="#c8a96e"/>
    <line x1="22" y1="11" x2="26" y2="11" stroke="#c8a96e" stroke-width="0.8" stroke-linecap="round"/>
    
    <!-- Side Phones -->
    <rect x="11.5" y="14" width="9" height="19" rx="2" fill="#2a4365" transform="rotate(-8 16 23)"/>
    <rect x="27.5" y="14" width="9" height="19" rx="2" fill="#2a4365" transform="rotate(8 32 23)"/>

    <!-- Small Golden Crown on Top -->
    <path d="M 19 8 L 21.5 10 L 24 7 L 26.5 10 L 29 8 L 28 12 L 20 12 Z" fill="url(#goldBorder)"/>
  </g>

  <!-- Brand Typography Lockup -->
  <!-- "DRG" Primary Wordmark -->
  <text x="74" y="38" 
        font-family="'Space Grotesk', 'Epilogue', 'Montserrat', 'Arial Black', sans-serif" 
        font-size="22" 
        font-weight="900" 
        letter-spacing="0.08em" 
        fill="url(#drgTextGrad)">DRG</text>

  <!-- Elegant 2D Separator Diamond Sparkle -->
  <path d="M 142 32 L 144.5 27 L 147 32 L 152 34.5 L 147 37 L 144.5 42 L 142 37 L 137 34.5 Z" fill="#e8d5a3"/>

  <!-- "PHONES PALACE" Secondary Tracked Wordmark -->
  <text x="160" y="38" 
        font-family="'Space Grotesk', 'Epilogue', 'Outfit', sans-serif" 
        font-size="13" 
        font-weight="800" 
        letter-spacing="0.24em" 
        fill="url(#palaceTextGrad)">PHONES PALACE</text>

  <!-- Subtle Micro-Crown Above Divider -->
  <path d="M 142.5 22 L 143.5 23 L 144.5 21.5 L 145.5 23 L 146.5 22 L 146 24.5 L 143 24.5 Z" fill="#c8a96e" opacity="0.9"/>
</svg>
